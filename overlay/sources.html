<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>SideLoader · Sources</title>
<style>body{font:16px/1.45 system-ui,-apple-system,sans-serif;margin:0;background:Canvas;color:CanvasText}main{max-width:760px;margin:0 auto;padding:24px 18px 70px}a{color:#087cf2}h1{margin:0 0 5px}p{color:GrayText}form{display:flex;gap:8px;margin:20px 0}input{flex:1;min-width:0;padding:12px;border:1px solid #8887;border-radius:8px;background:Canvas;color:CanvasText}button{padding:9px 15px;border:0;border-radius:9px;background:#087cf2;color:white;cursor:pointer;font-weight:600}button:disabled{opacity:.4}button.remove{background:transparent;color:#d35}section{padding:16px;margin:13px 0;border:1px solid #8884;border-radius:12px}.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.app{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #8883}.app small{display:block;color:GrayText;overflow-wrap:anywhere}.status{padding:10px;border-radius:8px;background:ButtonFace;min-height:20px}code{overflow-wrap:anywhere}label{display:block}header{display:flex;align-items:center;justify-content:space-between;gap:16px}@media(max-width:450px){form{flex-direction:column}.app{align-items:start}.app button{flex-shrink:0}}
#github-scan{display:flex;flex-direction:column;gap:10px}
#github-scan label{font-size:13px;color:GrayText;font-weight:600}
#github-scan input{display:block;width:100%;margin-top:5px;font-weight:400}
#github-discovery{margin:20px 0}
#github-disconnect{min-height:44px;margin-top:8px}
#github-scan-result ul{margin:8px 0 0;padding-left:24px}
.source-actions-row{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}
.source-actions-row button{min-height:44px}
.source-panel[hidden]{display:none!important}
.source-card-actions{display:flex;align-items:center;gap:10px}
.source-card-actions a{font-weight:700;text-decoration:none;padding:9px 4px}
/* SideLoader mobile navigation and touch-first source cards */
*{box-sizing:border-box}
html{scroll-padding-bottom:calc(95px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
body{padding-bottom:calc(50px + env(safe-area-inset-bottom));overflow-x:hidden}
main{max-width:680px;padding-bottom:calc(85px + env(safe-area-inset-bottom))}
header{min-height:44px}
section{min-width:0;overflow-wrap:anywhere}
section>small{display:block;overflow-wrap:anywhere;margin-top:4px;color:GrayText;font-size:12px}
.app>div{min-width:0;flex:1}
.app strong{display:block;overflow-wrap:anywhere}
.app button,.heading button,form button{min-height:44px;touch-action:manipulation}
.heading>strong{min-width:0;flex:1;overflow-wrap:anywhere}
.status{line-height:1.4;overflow-wrap:anywhere}
.sources-tabs{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;align-items:stretch;justify-content:center;min-height:56px;padding-bottom:max(env(safe-area-inset-bottom),4px);background:color-mix(in srgb,Canvas 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 -1px 0 #8884}
.sources-tabs a{display:flex;align-items:center;justify-content:center;flex:1;min-height:52px;max-width:220px;text-align:center;text-decoration:none;color:GrayText;font-size:13px;font-weight:600;touch-action:manipulation}
.sources-tabs a[aria-current=page]{color:#087cf2}
.sources-tabs a:focus-visible{outline:2px solid #087cf2;outline-offset:-4px}
input{font-size:16px}
@media(max-width:540px){
  main{padding:calc(15px + env(safe-area-inset-top)) 12px calc(80px + env(safe-area-inset-bottom))}
  h1{font-size:29px}
  form{flex-direction:column;gap:10px}
  form button{width:100%}
  section{padding:13px;margin:10px 0}
  .heading{align-items:flex-start}
  .app{gap:8px;padding:12px 0;align-items:flex-start}
  .app button{padding:10px 12px;min-width:80px}
  .sources-tabs{padding-bottom:max(env(safe-area-inset-bottom),4px)}
  .sources-tabs a{font-size:14px}
}
@media(max-width:350px){.app{flex-wrap:wrap}.app button{margin-left:auto}}

/* Full-page source confirmation: no native browser confirm dialogs. */
main.sl-confirming > :not(header):not(#sources-action){display:none!important}
#sources-action[hidden]{display:none!important}
#sources-action{max-width:640px;min-height:280px;padding:30px;border-radius:20px;border:1px solid #8884;background:ButtonFace}
#sources-action h2{margin:0 0 14px;font-size:26px}
#sources-action p{color:CanvasText;line-height:1.6}
#sources-action .source-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
#sources-action .source-cancel{background:transparent;color:CanvasText;border:1px solid #8887}
#sources-action .source-danger{background:#b72c3b}
.top-nav{position:sticky;top:0;z-index:25;display:flex;justify-content:flex-end;align-items:center;gap:12px;min-height:52px;padding:7px max(16px,calc((100vw - 760px)/2));background:color-mix(in srgb,Canvas 88%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid #8883}
.top-version{color:GrayText;font-size:13px}.top-settings{position:relative}.top-settings summary{list-style:none;color:#087cf2;cursor:pointer;padding:9px 12px}.top-settings summary::-webkit-details-marker{display:none}.top-menu{position:absolute;right:0;top:100%;min-width:180px;padding:7px;background:Canvas;border:1px solid #8884;border-radius:12px;box-shadow:0 12px 35px #0003}.top-menu a{display:block;padding:10px 12px;text-decoration:none;border-radius:8px}.top-menu a:hover,.top-menu a[aria-current]{background:ButtonFace}.top-signout{border:0;background:none;color:#087cf2;font:inherit;cursor:pointer;padding:9px 0}@media(hover:hover){.top-settings:hover .top-menu{display:block}.top-settings:not(:hover):not([open]) .top-menu{display:none}}
</style>
</head><body><header class="top-nav"><span class="top-version" id="top-version">SideLoader</span><details class="top-settings"><summary>Settings</summary><nav class="top-menu"><a href="/sources" aria-current="page">Sources</a><a href="/roadmap">Roadmap</a></nav></details><button class="top-signout" id="top-signout">Sign Out</button></header><main><header><h1>Sources</h1></header><section id="sources-action" hidden aria-live="polite"></section>
<div id="status" class="status" role="status">Loading sources…</div><div id="sources"></div>
<div class="source-actions-row"><button type="button" id="show-add-source">Add source</button><button type="button" id="show-github-scan">Scan GitHub</button></div>
<section id="add-source-panel" class="source-panel" hidden><div class="heading"><strong>Add source URL</strong></div>
<form id="add"><input id="url" type="url" placeholder="https://example.com/apps.json" required aria-label="AltStore source URL"><button>Add source</button></form></section>
<section id="github-discovery" class="source-panel" hidden><div class="heading"><strong>Scan GitHub</strong></div>
<form id="github-scan"><label for="github-profile">GitHub profile<input id="github-profile" type="text" inputmode="url" placeholder="https://github.com/ssnanda" required></label>
<label for="github-token">Read-only GitHub token (optional)<input id="github-token" type="password" placeholder="Needed for private repositories" autocomplete="off"></label>
<button type="submit">Scan and add sources</button></form>
<div id="github-credential-status" class="status" role="status">Checking GitHub access…</div>
<div id="github-scan-result" class="status" role="status" style="margin-top:8px">No scan performed yet.</div>
<button id="github-disconnect" type="button" class="remove" hidden>Forget saved GitHub token</button>
<small>For private repositories, use a fine-grained token with read-only Contents permission.</small></section></main>
<script>
const $=id=>document.getElementById(id);
let busy=false;
const apiState=fetch('/api/state',{credentials:'same-origin',headers:{'X-Requested-With':'sideloop'}}).then(r=>r.json()).then(s=>$('top-version').textContent='SideLoader '+(s.sideloop_build?.side_loader_version||'unknown')).catch(()=>{});
document.getElementById('top-signout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'sideloop'},body:'{}'});location.href='/'};
function togglePanel(id){
  for(const panel of document.querySelectorAll('.source-panel')) panel.hidden=panel.id!==id || !panel.hidden;
}
function node(tag,text,css){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(css)x.className=css;return x}
async function api(path,body){const res=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Requested-With':'sideloop'},credentials:'same-origin',body:body?JSON.stringify(body):undefined});const data=await res.json();if(!res.ok)throw Error(data.error||`HTTP ${res.status}`);return data}
async function work(label,fn){if(busy)return;busy=true;$('status').textContent=label;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){$('status').textContent='Error: '+e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function sourceConfirm(title,detail,label,handler){
  const main=document.querySelector('main'),panel=$('sources-action');
  main.classList.add('sl-confirming');
  panel.hidden=false;
  panel.replaceChildren();
  const heading=node('h2',title);
  const copy=node('p',detail);
  const actions=node('div',undefined,'source-actions');
  const cancel=node('button','Back to Sources','source-cancel');
  const accept=node('button',label,'source-danger');
  const close=()=>{main.classList.remove('sl-confirming');panel.hidden=true;panel.replaceChildren();};
  cancel.addEventListener('click',close);
  accept.addEventListener('click',()=>work(label+'…',async()=>{
    await handler();close();
  }));
  actions.append(cancel,accept);
  panel.append(heading,copy,actions);
  window.scrollTo({top:0,behavior:'smooth'});
}
async function refresh(){
  const data=await api('/api/sources');
  const wrap=$('sources');
  wrap.replaceChildren();
  $('status').textContent=`${data.sources.length} saved sources`;
  for(const source of data.sources){
    const sec=node('section');
    const head=node('div',undefined,'heading');
    const title=node('strong',source.name);
    const actions=node('div',undefined,'source-card-actions');
    const view=node('a','View apps');
    view.href='/#apps-add';
    const del=node('button','Remove','remove');
    del.addEventListener('click',()=>sourceConfirm('Remove source?',source.name+' will be removed from the saved source list. Imported IPAs remain available.','Remove source',async()=>{
      await api('/api/sources/remove',{id:source.id});await refresh();
    }));
    actions.append(view,del);
    head.append(title,actions);
    sec.append(head,node('small',source.url));
    if(source.error)sec.append(node('p','Source unavailable: '+source.error));
    else sec.append(node('small',source.apps.length+' apps available in Apps tab'));
    wrap.append(sec);
  }
}
async function githubStatus(){
  const s=await api('/api/sources/github/status');
  $('github-credential-status').textContent=s.has_token?'Private repository access configured on this server.':'Public repositories only; no GitHub token saved.';
  $('github-disconnect').hidden=!s.has_token;
}
$('github-scan').addEventListener('submit',e=>{
  e.preventDefault();
  work('Scanning GitHub repositories and checking for duplicates…',async()=>{
    const url=$('github-profile').value.trim();
    const token=$('github-token').value.trim();
    if(token && !(location.protocol==='https:' || ['localhost','127.0.0.1','::1','[::1]'].includes(location.hostname)))
      throw Error('Private GitHub tokens must be entered at localhost or over HTTPS, not LAN HTTP.');
    const result=await api('/api/sources/github/scan',{url,token});
    $('github-token').value='';
    await refresh();
    await githubStatus();
    const panel=$('github-scan-result');
    panel.replaceChildren(node('strong',result.repositories_scanned+' repos scanned · '+result.matching_files+' found · '+result.added+' added · '+result.already_exists+' already saved · '+result.invalid+' invalid'));
    if(result.sources.length){
      const list=node('ul');
      for(const found of result.sources)list.append(node('li',found.repository+' — '+found.name));
      panel.append(list);
    }
    if(result.warnings.length)panel.append(node('p',result.warnings.slice(0,8).join(' | ')));
  });
});
$('show-add-source').addEventListener('click',()=>togglePanel('add-source-panel'));
$('show-github-scan').addEventListener('click',()=>togglePanel('github-discovery'));
$('github-disconnect').addEventListener('click',()=>sourceConfirm(
  'Forget saved GitHub token?',
  'Private sources may become unavailable until another read-only token is added.',
  'Forget token',
  async()=>{
    await api('/api/sources/github/disconnect',{});
    await githubStatus();
    await refresh();
  }
));
$('add').addEventListener('submit',e=>{e.preventDefault();work('Validating JSON source…',async()=>{await api('/api/sources/add',{url:$('url').value.trim()});$('url').value='';await refresh()})});Promise.all([refresh(),githubStatus()]).catch(e=>$('status').textContent='Error: '+e.message);
</script></body></html>
