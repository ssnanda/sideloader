<!-- SideLoader: optional diagnostics; no dependencies -->
<div id="sideloader-diag-panel" hidden role="dialog" aria-modal="true" aria-labelledby="sideloader-diag-title" style="position:fixed;inset:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));z-index:99;background:Canvas;color:CanvasText;border:1px solid #8885;padding:16px;overflow:auto;box-shadow:0 4px 30px #0008;border-radius:14px;font:14px system-ui;max-width:720px;margin:auto">
  <button type="button" id="sideloader-close-diag" style="float:right;min-height:44px;padding:8px">Close</button>
  <h3 id="sideloader-diag-title">Sanitized diagnostic report</h3><p>Review this report before sharing it in chat. Passwords and verification codes are filtered.</p>
  <textarea id="sideloader-diag-text" aria-label="Sanitized diagnostics" readonly style="width:100%;height:min(65vh,560px);font:12px ui-monospace,monospace;resize:vertical"></textarea>
  <button type="button" id="sideloader-select-diag" style="min-height:44px;padding:10px">Select all</button>
</div>
<script>
(() => {
  const panel = document.getElementById('sideloader-diag-panel');
  const area = document.getElementById('sideloader-diag-text');
  document.getElementById('sideloader-close-diag').onclick = () => { panel.hidden = true; };
  document.getElementById('sideloader-select-diag').onclick = () => { area.focus();area.select(); };
  // The Activity page is recreated during polling, so use delegated events.
  document.addEventListener('click', async e => {
    const copy = e.target.closest('#sideloader-copy-diagnostics');
    if (!copy || copy.disabled) return;
    copy.disabled = true; copy.textContent = 'Preparing report…';
    try {
      const r = await fetch('/api/diagnostics', {credentials:'same-origin',cache:'no-store'});
      if (!r.ok) throw new Error(r.status === 401 ? 'Sign in to the dashboard first.' : `HTTP ${r.status}`);
      const report = await r.text();
      try {
        if (!navigator.clipboard || !window.isSecureContext) throw new Error('clipboard unavailable');
        await navigator.clipboard.writeText(report);
        copy.textContent = 'Copied!';
      } catch (ignored) {
        area.value = report;panel.hidden=false;area.focus();area.select();
        copy.textContent = 'Select and copy report';
      }
    } catch (err) { copy.textContent = err.message; }
    finally { copy.disabled = false;setTimeout(() => { if(copy.isConnected) copy.textContent='Copy Diagnostics'; }, 5000); }
  });
})();
</script>
