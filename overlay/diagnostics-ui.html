<!-- SideLoader: optional diagnostics; no dependencies -->
<div id="sideloader-diagnostics-controls" style="position:fixed;bottom:calc(112px + env(safe-area-inset-bottom));left:12px;z-index:18">
  <button id="sideloader-copy-diagnostics" type="button" style="background:#285b91;color:white;border:0;border-radius:16px;padding:10px 14px;font:600 13px system-ui;box-shadow:0 2px 10px #0003">Copy Diagnostics</button>
</div>
<div id="sideloader-diag-panel" hidden style="position:fixed;inset:5%;z-index:99;background:Canvas;color:CanvasText;border:1px solid #888;padding:16px;overflow:auto;box-shadow:0 4px 30px #0008;border-radius:12px;font:14px system-ui">
  <button type="button" id="sideloader-close-diag" style="float:right;padding:8px">Close</button>
  <h3>Sanitized diagnostic report</h3><p>Copy the text below and paste it into ChatGPT. Passwords and verification codes are filtered; please review before sharing.</p>
  <textarea id="sideloader-diag-text" style="width:100%;height:60vh;font:12px ui-monospace,monospace"></textarea>
  <button type="button" id="sideloader-select-diag" style="padding:10px">Select all</button>
</div>
<script>
(() => {
  const copy = document.getElementById('sideloader-copy-diagnostics');
  const panel = document.getElementById('sideloader-diag-panel');
  const area = document.getElementById('sideloader-diag-text');
  document.getElementById('sideloader-close-diag').onclick = () => { panel.hidden = true; };
  document.getElementById('sideloader-select-diag').onclick = () => { area.focus();area.select(); };
  copy.onclick = async () => {
    copy.disabled = true; copy.textContent = 'Preparing report…';
    try {
      const r = await fetch('/api/diagnostics', {credentials:'same-origin',cache:'no-store'});
      if (!r.ok) throw new Error(r.status === 401 ? 'Sign in to the dashboard first.' : `HTTP ${r.status}`);
      const report = await r.text();
      try {
        if (!navigator.clipboard || !window.isSecureContext) throw new Error('clipboard unavailable');
        await navigator.clipboard.writeText(report);
        copy.textContent = 'Copied!';
      } catch (ignored) {
        area.value = report;panel.hidden=false;area.focus();area.select();
        copy.textContent = 'Select and copy report';
      }
    } catch (err) { copy.textContent = err.message; }
    finally { copy.disabled = false;setTimeout(() => {copy.textContent='Copy Diagnostics';}, 5000); }
  };
})();
</script>
