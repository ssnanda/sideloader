name: SideLoader CI and Companion Release

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sideloader-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check overlay Python syntax
        run: python3 -m compileall -q overlay
      - name: Check dashboard JavaScript syntax
        run: |
          node --check overlay/apps-dashboard-ui.js
          node --check overlay/apps-dashboard-wire.js
          node --check overlay/screen-flow-ui.js
      - name: Run offline regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  build-ipa:
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Determine version
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "Invalid VERSION: $CURRENT_VERSION" >&2
            exit 1
          fi
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> "$GITHUB_ENV"
          echo "SEMVER=${CURRENT_VERSION%+*}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${CURRENT_VERSION##*+}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${CURRENT_VERSION%+*}" >> "$GITHUB_ENV"

      - name: Compile unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project companion/SideLoaderCompanion.xcodeproj \
            -scheme SideLoaderCompanion \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SideLoaderDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION=1.0 \
            build

      - name: Package and verify IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SideLoaderDerivedData/Build/Products/Release-iphoneos/SideLoader Companion.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")" = "$BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")" = "1.0"
          mkdir -p "$RUNNER_TEMP/SideLoaderPayload/Payload" dist
          ditto "$APP" "$RUNNER_TEMP/SideLoaderPayload/Payload/SideLoader Companion.app"
          IPA="dist/sideloader-companion-v${SEMVER}-${BUILD_NUMBER}.ipa"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/SideLoaderPayload/Payload" "$IPA"
          cp "$IPA" dist/sideloader-companion.ipa
          unzip -t "$IPA"
          shasum -a 256 "$IPA"

      - name: Upload independent IPA build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sideloader-companion-v${{ env.SEMVER }}-${{ env.BUILD_NUMBER }}
          path: dist/*.ipa
          retention-days: 1
          if-no-files-found: error

      - name: Update AltStore metadata for actual built IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          path = Path("altstore.json")
          doc = json.loads(path.read_text())
          app = next(a for a in doc["apps"]
                     if a["bundleIdentifier"] == "com.ajnanda.SideLoaderCompanion")
          version, build = "1.0", os.environ["BUILD_NUMBER"]
          latest = {
              "version": version,
              "buildVersion": build,
              "date": datetime.datetime.now(datetime.timezone.utc).date().isoformat(),
              "localizedDescription": (
                  "Verified installed-app list, live refresh, individual per-app "
                  "re-signing with status and Apple verification-code entry."
              ),
              "downloadURL": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/"
                  f"download/{os.environ['RELEASE_TAG']}/sideloader-companion.ipa"
              ),
              "size": Path("dist/sideloader-companion.ipa").stat().st_size,
              "minOSVersion": "17.0"
          }
          app["versions"] = [latest] + [
              v for v in app.get("versions", [])
              if (str(v.get("version")), str(v.get("buildVersion"))) != (version, build)
          ]
          app["subtitle"] = "View and re-sign installed SideLoader apps."
          app["localizedDescription"] = (
              "Connect to SideLoader using LAN or NetBird. Scan your iPhone's "
              "installed apps and re-sign individual SideLoader-managed apps, "
              "with live signing status and Apple verification-code entry."
          )
          path.write_text(json.dumps(doc, indent=2, ensure_ascii=False) + "\n")
          PY

      - name: Publish unsigned IPA to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SideLoader $CURRENT_VERSION" \
              --notes "Unsigned iPhone companion IPA; SideLoader applies the development signature during installation."
          fi
          gh release upload "$RELEASE_TAG" \
            "dist/sideloader-companion-v${SEMVER}-${BUILD_NUMBER}.ipa" \
            dist/sideloader-companion.ipa \
            altstore.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Commit updated AltStore source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish SideLoader Companion $CURRENT_VERSION source [skip ci]"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            echo "Could not update altstore.json after five retries" >&2
            exit 1
          fi

  cleanup:
    name: Cleanup old completed workflow runs
    needs: [validate, build-ipa]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Prune previous SideLoader CI records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the newest 3 successes and 2 failures for diagnosis.
          # Older completed/cancelled SideLoader runs are safe to prune.
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > "$RUNNER_TEMP/runs.json"
          jq -r --argjson current "$GITHUB_RUN_ID" '
            [.workflow_runs[]
            | select(.name == "SideLoader CI and Companion Release"
                     or .name == "Build and publish SideLoader Companion IPA"
                     or .name == "Validate SideLoader Docker overlays")
            | select(.status == "completed")
            | select(.id != $current)] as $runs
            | ($runs | map(select(.conclusion == "success")) | .[3:] | .[].id),
              ($runs | map(select(.conclusion == "failure")) | .[2:] | .[].id),
              ($runs | map(select(.conclusion == "cancelled")) | .[].id)
          ' "$RUNNER_TEMP/runs.json" | sort -u > "$RUNNER_TEMP/delete-ids.txt"
          while IFS= read -r id; do
            [[ -n "$id" ]] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null ||
              echo "Warning: could not delete old run $id" >&2
          done < "$RUNNER_TEMP/delete-ids.txt"

