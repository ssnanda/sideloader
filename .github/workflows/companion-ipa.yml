name: Build and publish SideLoader Companion IPA

on:
  push:
    branches: [main]
    paths:
      - "companion/**"
      - "VERSION"
      - ".github/workflows/companion-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sideloader-companion-publish
  cancel-in-progress: false

jobs:
  build-ipa:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Determine version
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "Invalid VERSION: $CURRENT_VERSION" >&2
            exit 1
          fi
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> "$GITHUB_ENV"
          echo "SEMVER=${CURRENT_VERSION%+*}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${CURRENT_VERSION##*+}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${CURRENT_VERSION%+*}" >> "$GITHUB_ENV"

      - name: Compile unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project companion/SideLoaderCompanion.xcodeproj \
            -scheme SideLoaderCompanion \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SideLoaderDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION=1.0 \
            build

      - name: Package and verify IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SideLoaderDerivedData/Build/Products/Release-iphoneos/SideLoader Companion.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")" = "$BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")" = "1.0"
          mkdir -p "$RUNNER_TEMP/SideLoaderPayload/Payload" dist
          ditto "$APP" "$RUNNER_TEMP/SideLoaderPayload/Payload/SideLoader Companion.app"
          IPA="dist/sideloader-companion-v${SEMVER}-${BUILD_NUMBER}.ipa"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/SideLoaderPayload/Payload" "$IPA"
          cp "$IPA" dist/sideloader-companion.ipa
          unzip -t "$IPA"
          shasum -a 256 "$IPA"

      - name: Upload independent IPA build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sideloader-companion-v${{ env.SEMVER }}-${{ env.BUILD_NUMBER }}
          path: dist/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Update AltStore metadata for actual built IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          path = Path("altstore.json")
          doc = json.loads(path.read_text())
          app = next(a for a in doc["apps"]
                     if a["bundleIdentifier"] == "com.ajnanda.SideLoaderCompanion")
          version, build = "1.0", os.environ["BUILD_NUMBER"]
          latest = {
              "version": version,
              "buildVersion": build,
              "date": datetime.datetime.now(datetime.timezone.utc).date().isoformat(),
              "localizedDescription": (
                  "Verified installed-app list, live refresh, individual per-app "
                  "re-signing with status and Apple verification-code entry."
              ),
              "downloadURL": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/"
                  f"download/{os.environ['RELEASE_TAG']}/sideloader-companion.ipa"
              ),
              "size": Path("dist/sideloader-companion.ipa").stat().st_size,
              "minOSVersion": "17.0"
          }
          app["versions"] = [latest] + [
              v for v in app.get("versions", [])
              if (str(v.get("version")), str(v.get("buildVersion"))) != (version, build)
          ]
          app["subtitle"] = "View and re-sign installed SideLoader apps."
          app["localizedDescription"] = (
              "Connect to SideLoader using LAN or NetBird. Scan your iPhone's "
              "installed apps and re-sign individual SideLoader-managed apps, "
              "with live signing status and Apple verification-code entry."
          )
          path.write_text(json.dumps(doc, indent=2, ensure_ascii=False) + "\n")
          PY

      - name: Publish unsigned IPA to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SideLoader $CURRENT_VERSION" \
              --notes "Unsigned iPhone companion IPA; SideLoader applies the development signature during installation."
          fi
          gh release upload "$RELEASE_TAG" \
            "dist/sideloader-companion-v${SEMVER}-${BUILD_NUMBER}.ipa" \
            dist/sideloader-companion.ipa \
            altstore.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Commit updated AltStore source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish SideLoader Companion $CURRENT_VERSION source [skip ci]"
            git push origin HEAD:main
          fi
