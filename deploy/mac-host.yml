# Requires Docker Desktop 4.34+ with host networking enabled. Container
# connects to the Mac's loopback-only socket proxy at 127.0.0.1:27015.
services:
  app:
    network_mode: host
    privileged: false
    environment:
      MUX: external
      USBMUXD_SOCKET_ADDRESS: 127.0.0.1:27015
      UI_PORT: "38080"
      # Nov 2026 AltServer-Linux NG (ng-2026-11-05): Mac anisette v3 provider.
      ANISETTE_SERVER: "${SIDELOADER_ANISETTE_SERVER:-https://new.ani.sidestore.io}"
      # AltStore's Oct 2026 fix matches GrandSlam User-Agent to the anisette
      # identity. new.ani.sidestore.io (/v3/client_info) reports this Mac akd UA.
      # AltServer-Linux NG honors ALTSERVER_GSA_USER_AGENT; do not override
      # X-Mme-Client-Info, which must remain the provider's provisioned value.
      # Custom anisette providers can supply a matching override.
      ALTSERVER_GSA_USER_AGENT: "${SIDELOADER_GSA_USER_AGENT:-akd/1.0 CFNetwork/811.5.4 Darwin/16.7.0}"
      ALLOW_HTTP_SOURCES: "${ALLOW_HTTP_SOURCES:-0}"
      ALLOW_PRIVATE_SOURCE_URLS: "${ALLOW_PRIVATE_SOURCE_URLS:-0}"
    volumes: !override
      - ./data:/data
